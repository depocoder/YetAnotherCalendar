# Маскирование клиентских секретов в access-логах реверс-прокси.
#
# URL ICS-подписки содержит секрет (/api/subscription/{id}/{secret}/...),
# по которому открывается календарь пользователя. Никто, включая
# разработчиков с доступом к логам, не должен его видеть.
#
# Подключение на хостовом nginx:
#   1. Скопируйте этот файл в /etc/nginx/conf.d/ (map должен быть в http {}).
#   2. В server {} для yetanothercalendar.ru замените access_log на:
#        access_log /var/log/nginx/access.log masked;
#   3. nginx -t && systemctl reload nginx

map $request_uri $masked_request_uri {
    "~^(?<prefix>/api/subscription/[0-9a-f]{32}/)[^/?]+(?<suffix>.*)$" "${prefix}***${suffix}";
    default $request_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_request_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
